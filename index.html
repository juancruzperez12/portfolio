<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juan Cruz Perez</title>
    <meta name="description" content="Juan Cruz Perez" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body { height: 100%; }

      body {
        background: #000;
        color: #f2f2f2;
        font-family: "Special Elite", "Courier New", Courier, monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        text-align: center;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
      }

      h1 {
        font-weight: 400;
        font-size: clamp(2rem, 8vw, 4.5rem);
        letter-spacing: 0.04em;
        min-height: 1.2em;
      }

      .cursor {
        display: inline-block;
        width: 0.55em;
        margin-left: 0.05em;
        animation: blink 1s steps(1) infinite;
      }

      @keyframes blink { 50% { opacity: 0; } }

      a {
        color: #f2f2f2;
        font-size: clamp(1rem, 3vw, 1.25rem);
        text-decoration: none;
        border-bottom: 1px solid #555;
        padding-bottom: 2px;
        opacity: 0;
        transition: opacity 0.8s ease, border-color 0.2s ease;
      }

      a.visible { opacity: 1; }
      a:hover, a:focus-visible { border-color: #f2f2f2; outline: none; }
    </style>
  </head>
  <body>
    <main>
      <h1><span id="text" aria-label="Juan Cruz Perez"></span><span class="cursor" aria-hidden="true">_</span></h1>
      <a id="linkedin" href="https://www.linkedin.com/in/perezjuancruz/" target="_blank" rel="noopener noreferrer">LinkedIn &rarr;</a>
    </main>

    <script>
      const name = "Juan Cruz Perez";
      const textEl = document.getElementById("text");
      const link = document.getElementById("linkedin");
      let i = 0;

      function type() {
        if (i < name.length) {
          textEl.textContent += name[i++];
          setTimeout(type, 90 + Math.random() * 90);
        } else {
          setTimeout(() => link.classList.add("visible"), 300);
        }
      }

      setTimeout(type, 500);
    </script>
  </body>
</html>
